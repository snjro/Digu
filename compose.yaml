services:
  app:
    image: node:24-slim
    user: "1001:1001"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0

  # Has Chrome for scripts/visual-compare and scripts/a11y-scan.
  # Keep the image tag the same as the puppeteer version in package-lock.json.
  test:
    image: ghcr.io/puppeteer/puppeteer:25.11.0
    profiles: ["test"]
    user: "1001:1001"
    working_dir: /app
    environment:
      HOME: /tmp
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer
    # Chrome's sandbox needs it; scripts/visual-compare launches Chrome without --no-sandbox.
    cap_add:
      - SYS_ADMIN
    volumes:
      - .:/app
    command: npm run vitest
