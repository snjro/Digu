services:
  app:
    image: node:24-slim
    user: "1001:1001"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0

  # Has Chrome for scripts/visual-compare, scripts/screen-check and scripts/a11y-scan.
  # Keep the image tag the same as the puppeteer version in package-lock.json.
  # The scripts launch Chrome with --no-sandbox, so the service needs no added
  # capability. Without Chrome's sandbox, only the container (uid 1001, no
  # added capability) protects the host from a page that breaks Chrome. Chrome
  # opens only our builds, the public site and the data of RPCs.
  test:
    image: ghcr.io/puppeteer/puppeteer:25.12.0
    profiles: ["test"]
    user: "1001:1001"
    working_dir: /app
    environment:
      HOME: /tmp
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer
    volumes:
      - .:/app
    command: npm run vitest
