name: Release
on:
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    # A called workflow cannot have more permissions than this.
    permissions:
      contents: read
      pull-requests: write

  deploy_GitHubPages:
    needs: test
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # No Chrome needed: skip the download in puppeteer's postinstall.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Node.js setup
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The app shows the version in package.json, not the tag.
      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error file=package.json::The tag ($GITHUB_REF_NAME) differs from v + the version in package.json (v$version)"
            exit 1
          fi

      - name: build
        run: npm ci && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_build"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Attaches the built site as a zip to a draft release; the owner writes the notes and publishes it.
  attach_zip_to_release:
    needs: test
    # A manual run has no tag to release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js setup
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The app shows the version in package.json, not the tag.
      - name: Check the tag against the version
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error file=package.json::The tag ($GITHUB_REF_NAME) differs from v + the version in package.json (v$version)"
            exit 1
          fi

      - name: build
        run: npm ci && npm run build

      - name: Zip the built site
        run: |
          mv _build "Digu-$TAG"
          zip -r "Digu-$TAG.zip" "Digu-$TAG"

      - name: Attach the zip to the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "Digu-$TAG.zip" --clobber
          else
            gh release create "$TAG" "Digu-$TAG.zip" --draft --verify-tag --title "$TAG"
          fi
