name: Test

on:
  pull_request:
    branches:
      - develop
  # Also test develop after a merge: two PRs can pass alone and fail together.
  push:
    branches:
      - develop
  workflow_dispatch: # By adding this event, you can run this workflow manually on GUI
  workflow_call: # release.yml runs the tests before it deploys

# No job launches Chrome: skip the download in puppeteer's postinstall.
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  run_unit_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to checkout the code
      pull-requests: write # Required to put a comment into the pull-request

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run vitest Tests
        run: npm run vitest:coverage

      - name: "Report Coverage"
        if: always() # Also generate the report if tests are failing
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0

  run_lint_and_check:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required to checkout the code

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install Dependencies
        id: install
        run: npm ci

      # Not `npm run lint`, which runs `eslint --fix`
      - name: Run prettier
        run: npx prettier --check --plugin prettier-plugin-svelte .

      - name: Run eslint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }} # Also run if prettier fails
        run: npx eslint .

      - name: Run svelte-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check -- --fail-on-warnings

      - name: Run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # dependabot updates package-lock.json but not compose.yaml
      - name: Check the puppeteer image tag
        if: ${{ !cancelled() }}
        run: |
          lock_version=$(jq -r '.packages["node_modules/puppeteer"].version' package-lock.json)
          image_tag=$(sed -n 's|^ *image: ghcr.io/puppeteer/puppeteer:||p' compose.yaml)
          if [ "$lock_version" != "$image_tag" ]; then
            echo "::error file=compose.yaml::The puppeteer image tag ($image_tag) differs from puppeteer in package-lock.json ($lock_version)"
            exit 1
          fi
